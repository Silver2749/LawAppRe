<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LawAppRe – IPC & BNS Search</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0e13;
      --surface: #12171f;
      --surface2: #1a212c;
      --border: #2a3444;
      --text: #e8edf4;
      --muted: #8b9bb0;
      --accent: #3b82f6;
      --accent-dim: rgba(59, 130, 246, 0.15);
      --accent-hover: #2563eb;
      --success: #22c55e;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.12), transparent);
    }
    .container { max-width: 780px; margin: 0 auto; padding: 2.75rem 1.25rem 4rem; }
    header { text-align: center; margin-bottom: 2rem; }
    .badge {
      display: inline-block; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-dim);
      padding: 0.28rem 0.7rem; border-radius: 999px; margin-bottom: 0.9rem;
    }
    header h1 { font-size: 1.95rem; font-weight: 700; margin-bottom: 0.45rem; }
    header p { color: var(--muted); font-size: 0.98rem; max-width: 440px; margin: 0 auto; }
    .corpus-toggle { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.25rem; }
    .corpus-toggle button {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      border-radius: 999px; padding: 0.4rem 1.1rem; font-size: 0.85rem;
      font-family: inherit; cursor: pointer;
    }
    .corpus-toggle button.active {
      background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600;
    }
    .search-box { display: flex; gap: 0.65rem; margin-bottom: 1.1rem; }
    .search-box input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.95rem 1.2rem; font-size: 1.02rem;
      color: var(--text); font-family: inherit; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .search-box button {
      background: var(--accent); color: white; border: none; border-radius: var(--radius);
      padding: 0.95rem 1.5rem; font-size: 0.95rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .search-box button:disabled { opacity: 0.55; cursor: not-allowed; }
    .examples { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.75rem; justify-content: center; }
    .examples span { font-size: 0.78rem; color: var(--muted); width: 100%; text-align: center; }
    .examples button {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      border-radius: 999px; padding: 0.38rem 0.9rem; font-size: 0.82rem;
      font-family: inherit; cursor: pointer;
    }
    .status { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 1.35rem; min-height: 1.4em; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .results { display: flex; flex-direction: column; gap: 0.9rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.3rem 1.45rem;
    }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 0.55rem; }
    .section-badge {
      font-family: "JetBrains Mono", monospace; font-size: 0.8rem;
      background: var(--accent-dim); color: var(--accent);
      padding: 0.22rem 0.6rem; border-radius: 7px;
    }
    .score { font-family: "JetBrains Mono", monospace; font-size: 0.78rem; color: var(--success); }
    .card h3 { font-size: 1.08rem; font-weight: 600; margin-bottom: 0.5rem; }
    .card p { color: var(--muted); font-size: 0.9rem; white-space: pre-wrap; }
    footer { text-align: center; margin-top: 3rem; color: var(--muted); font-size: 0.8rem; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">Powered by InsightLaw API</div>
      <h1>IPC & BNS Section Finder</h1>
      <p>Describe an activity or offense in everyday language.</p>
    </header>

    <div class="corpus-toggle">
      <button id="btnIpc" class="active" onclick="setCorpus('ipc')">IPC</button>
      <button id="btnBns" onclick="setCorpus('bns')">BNS 2023</button>
    </div>

    <div class="search-box">
      <input type="text" id="query" placeholder="e.g. someone steals my phone..." autofocus />
      <button id="searchBtn" onclick="doSearch()">Search</button>
    </div>

    <div class="examples">
      <span>Try an example</span>
      <button onclick="setQuery('someone steals my phone')">Theft of phone</button>
      <button onclick="setQuery('killing a person intentionally')">Murder</button>
      <button onclick="setQuery('husband tortures wife for dowry')">Dowry cruelty</button>
      <button onclick="setQuery('cheating someone by promising fake job')">Cheating</button>
    </div>

    <div class="status" id="status"></div>
    <div class="results" id="results"></div>

    <footer>
      Not legal advice · Data from <a href="https://insightlaw.in" target="_blank">InsightLaw</a>
    </footer>
  </div>

  <script>
    let currentCorpus = "ipc";

    const queryEl = document.getElementById("query");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const searchBtn = document.getElementById("searchBtn");
    const btnIpc = document.getElementById("btnIpc");
    const btnBns = document.getElementById("btnBns");

    queryEl.addEventListener("keydown", function(e) {
      if (e.key === "Enter") doSearch();
    });

    function setCorpus(corpus) {
      currentCorpus = corpus;
      btnIpc.classList.toggle("active", corpus === "ipc");
      btnBns.classList.toggle("active", corpus === "bns");
    }

    function setQuery(text) {
      queryEl.value = text;
      doSearch();
    }

    async function doSearch() {
      const query = queryEl.value.trim();
      if (!query) return;

      searchBtn.disabled = true;
      statusEl.innerHTML = '<span class="spinner"></span>Searching...';
      resultsEl.innerHTML = "";

      try {
        const res = await fetch("/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: query,
            corpus: currentCorpus,
            top_n: 5
          })
        });

        if (!res.ok) {
          throw new Error("Search failed (" + res.status + ")");
        }

        const data = await res.json();

        if (!data || data.length === 0) {
          statusEl.textContent = "No matches found";
          return;
        }

        statusEl.textContent = "Top " + data.length + " matching sections";

        resultsEl.innerHTML = data.map(function(r) {
          return '<article class="card">' +
            '<div class="card-header">' +
              '<span class="section-badge">' + (r.corpus || currentCorpus.toUpperCase()) + ' § ' + r.section + '</span>' +
              '<span class="score">Score: ' + r.score + '</span>' +
            '</div>' +
            '<h3>' + escapeHtml(r.title) + '</h3>' +
            '<p>' + escapeHtml(r.description) + '</p>' +
          '</article>';
        }).join("");

      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      } finally {
        searchBtn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
